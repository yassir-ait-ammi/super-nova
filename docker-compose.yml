services:
  postgres:
    image: postgres:16-alpine
    container_name: nova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova_root
      POSTGRES_PASSWORD: nova_root_local_only
      POSTGRES_DB: nova
    ports:
      - "5433:5432"
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_root -d nova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nova_postgres_data:
